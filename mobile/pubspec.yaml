name: gala_sang
description: "Gala Sang - Stream, search, and listen to free songs, top charts, live audio radio, custom playlists, downloads and more. Mobile companion of the Gala-Sang web app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  just_audio: ^0.9.42
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4
  http: ^1.2.2
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#050505"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png